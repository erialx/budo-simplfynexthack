[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navvlm-orcalab"
version = "0.1.0"
description = "Self-contained NavVLM automatic-navigation example for OrcaLab"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.60",
  "numpy>=1.26",
  "Pillow>=10",
]

[project.optional-dependencies]
orca = [
  "av>=12",
  "opencv-python>=4.10",
  "orca-gym==26.6.3",
  "orca-lab==26.6.3",
  "mjlab==1.2.0",
  "mujoco-warp==3.5.0",
  "rsl-rl-lib==5.0.1",
  "torch==2.12.0",
  "torchvision==0.27.0",
  "websockets>=12",
]
test = ["pytest>=8"]

[project.scripts]
navvlm-orcalab = "navila_orca.cli:main"
navvlm-orcalab-render-server = "navila_orca.render.grpc_bridge:server_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
navila_orca = [
  "assets/checkpoints/*.pt",
  "go2_task/assets/robots/unitree_go2/xmls/*.xml",
  "go2_task/assets/robots/unitree_go2/xmls/assets/*.obj",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
